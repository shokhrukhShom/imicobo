<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iMicobo · Receiver</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0a0c10">
<style>
  :root{
    --bg:#0a0c10; --panel:#141922; --panel2:#1b2230; --line:#2a3340;
    --ink:#e8eef5; --dim:#8593a5; --accent:#5eead4; --ok:#4ade80;
    --warn:#fbbf24; --bad:#f87171;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:grid;place-items:center;padding:32px}
  .wrap{width:min(560px,100%);text-align:center}
  .brand{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
  h1{font-size:30px;font-weight:650;margin:0 0 6px}
  .sub{color:var(--dim);font-size:15px;margin:0 0 26px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 26px}
  .lbl{color:var(--dim);font-size:14px}
  .code{font:700 44px var(--mono);letter-spacing:10px;margin:10px 0 4px;color:var(--accent);white-space:nowrap}
  .code.waiting{color:var(--dim);opacity:.35}
  .qr{margin:16px auto 6px;width:200px;height:200px;background:#fff;border-radius:14px;padding:10px;display:none}
  .qr.show{display:block}.qr svg{display:block;width:100%;height:100%}
  .or{color:var(--dim);font-size:12px;letter-spacing:2px;text-transform:uppercase;margin:14px 0 2px}
  .hint{color:var(--dim);font-size:14px;margin-top:8px}

  /* roster of connected singers */
  .roster{margin-top:18px;display:flex;flex-direction:column;gap:8px;text-align:left}
  .mic{display:flex;align-items:center;gap:12px;background:var(--panel2);
    border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .mic .who{flex:1;min-width:0}
  .mic .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mic .st{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
  .mic .st.ok{color:var(--ok)} .mic .st.fair{color:var(--warn)} .mic .st.poor{color:var(--bad)}
  .mic input[type=range]{width:96px;accent-color:var(--accent)}
  .mic .mute{background:var(--panel);border:1px solid var(--line);color:var(--ink);
    font:600 13px inherit;border-radius:9px;padding:7px 11px;cursor:pointer;white-space:nowrap}
  .mic.muted .mute{background:var(--bad);color:#2a0b0b;border-color:var(--bad)}
  .mic.muted .nm{color:var(--dim)}

  .status{display:inline-flex;align-items:center;gap:8px;margin-top:22px;font-size:14px;color:var(--dim)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
  .dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .dot.mid{background:var(--warn)} .dot.bad{background:var(--bad)}
  .btns{display:flex;gap:10px;justify-content:center;margin-top:20px}
  button{font:600 15px inherit;border:none;border-radius:11px;padding:12px 22px;cursor:pointer}
  .cancel{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  audio{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">iMicobo</div>
  <h1 id="title">Add your microphones</h1>
  <p class="sub" id="subtitle">Up to 6 phones can sing on this screen at once.</p>

  <div class="card">
    <div class="lbl">Scan with the iMicobo app — or type the code</div>
    <div class="qr" id="qr"></div>
    <div class="or">code</div>
    <div class="code waiting" id="code">– – – –</div>
    <div class="roster" id="roster"></div>
    <div class="hint" id="hint">Waiting for the first singer…</div>
    <div class="btns"><button class="cancel" onclick="newCode()">New code</button></div>
  </div>

  <div class="status"><span class="dot" id="dot"></span><span id="statusText">Starting…</span></div>
</div>

<script src="qr.js"></script>
<script>
const CFG={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
const $=id=>document.getElementById(id);
function setStatus(t,c){$('statusText').textContent=t;$('dot').className='dot'+(c?' '+c:'');}

let myCode=null, poll=null, statsTimer=null;
const mics = {};           // id -> {pc,name,gain,src,audio,muted,volume,jitter,live,starting}

/* ───────── shared effects chain (ONE for the whole room) ─────────
   every mic ─▶ its own gain ─▶ mixBus ─▶ EQ ─▶ comp ─┬▶ dry ───┐
                                                       ├▶ reverb ┤▶ out ▶ master ▶ speakers
                                                       └▶ echo ──┘
   Per-mic volume/mute live on each mic's gain. Reverb/echo/EQ are shared
   (last phone to change them sets the room's vibe) — cheapest + lowest latency. */
let ctx=null, chain=null, usingFX=false;
function buildChain(){
  ctx = new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  const mixBus=ctx.createGain(), inputGain=ctx.createGain(),
        bass=ctx.createBiquadFilter(), mid=ctx.createBiquadFilter(), treble=ctx.createBiquadFilter(),
        comp=ctx.createDynamicsCompressor(), dry=ctx.createGain(),
        reverbWet=ctx.createGain(), echoWet=ctx.createGain(), convolver=ctx.createConvolver(),
        delay=ctx.createDelay(1.0), feedback=ctx.createGain(),
        out=ctx.createGain(), master=ctx.createGain();
  bass.type='lowshelf'; bass.frequency.value=200;
  mid.type='peaking'; mid.frequency.value=1200; mid.Q.value=0.9;
  treble.type='highshelf'; treble.frequency.value=3500;
  comp.threshold.value=-24; comp.knee.value=24; comp.ratio.value=3; comp.attack.value=0.005; comp.release.value=0.2;
  convolver.buffer=impulse(1.8,2.0); delay.delayTime.value=0.22; feedback.gain.value=0.3;
  delay.connect(feedback); feedback.connect(delay);
  mixBus.connect(inputGain); inputGain.connect(bass); bass.connect(mid); mid.connect(treble); treble.connect(comp);
  comp.connect(dry); dry.connect(out);
  comp.connect(convolver); convolver.connect(reverbWet); reverbWet.connect(out);
  comp.connect(delay); delay.connect(echoWet); echoWet.connect(out);
  out.connect(master); master.connect(ctx.destination);
  dry.gain.value=1; reverbWet.gain.value=0; echoWet.gain.value=0; out.gain.value=1; master.gain.value=0;
  chain={mixBus,inputGain,bass,mid,treble,comp,dry,reverbWet,echoWet,convolver,delay,feedback,out,master};
}
function impulse(seconds,decay){
  const rate=ctx.sampleRate, len=Math.max(1,Math.floor(rate*seconds)), buf=ctx.createBuffer(2,len,rate);
  for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay); }
  return buf;
}
function applyShared(p){
  if(!chain) return;
  const t=ctx.currentTime, set=(pm,v)=>pm.setTargetAtTime(v,t,0.02);
  if(p.reverb!=null) set(chain.reverbWet.gain,p.reverb*0.9);
  if(p.echo!=null) set(chain.echoWet.gain,p.echo*0.6);
  if(p.echoTime!=null) set(chain.delay.delayTime,0.08+p.echoTime*0.5);
  if(p.echoFeed!=null) set(chain.feedback.gain,p.echoFeed*0.75);
  if(p.bass!=null) set(chain.bass.gain,(p.bass-0.5)*24);
  if(p.mid!=null) set(chain.mid.gain,(p.mid-0.5)*24);
  if(p.treble!=null) set(chain.treble.gain,(p.treble-0.5)*24);
  if(p.compress!=null) set(chain.comp.ratio,p.compress?4:1);
  if(p.reverbSize!=null) chain.convolver.buffer=impulse(0.4+p.reverbSize*3.0,2.0);
  const wet=(p.reverb??0)*0.9+(p.echo??0)*0.6;
  set(chain.dry.gain, Math.max(0.35, 1-wet*0.45));
}
function tryActivateFX(){
  if(usingFX || !ctx || ctx.state!=='running' || !chain) return;
  usingFX=true; chain.master.gain.value=1;
  // the mix now carries all audio — silence the raw per-mic <audio> elements
  Object.values(mics).forEach(m=>{ if(m.audio) m.audio.muted=true; applyLevel(m); });
}
function unlockAudio(){ if(ctx) ctx.resume().then(tryActivateFX).catch(()=>{}); }
['click','keydown','touchstart','pointerdown'].forEach(ev=>
  document.addEventListener(ev,()=>{ if(!usingFX) unlockAudio(); }));
setInterval(()=>{ if(ctx && !usingFX) unlockAudio(); }, 2000);

/* ───────── pairing / room ───────── */
async function boot(){
  try{
    const kept = localStorage.getItem('imicobo.screencode') || '';
    const s = await (await fetch('/session' + (kept?`?code=${encodeURIComponent(kept)}`:''),
                                 {method:'POST'})).json();
    myCode = s.code; const qrHost = /^(localhost|127\.|0\.0\.0\.0)/.test(location.hostname) ? (s.host||location.host) : location.host;
    localStorage.setItem('imicobo.screencode', myCode);
    $('code').textContent = myCode;
    $('code').classList.remove('waiting');
    try{ $('qr').innerHTML = QR.svg(`${location.origin}/j?c=${myCode}`,200); $('qr').classList.add('show'); }catch(_){}
    setStatus('Waiting for singers…','mid');
    poll = setInterval(tick, 900);
    statsTimer = setInterval(updateStats, 1000);
  }catch(e){ setStatus('Relay not reachable — is the server running?','bad'); }
}
async function newCode(){ if(myCode) await fetch(`/cancel?code=${myCode}`,{method:'POST'}); location.reload(); }

/* poll the roster: start any new mic, drop any that left */
async function tick(){
  if(!myCode) return;
  let s; try{ s = await (await fetch(`/session?code=${myCode}`)).json(); }catch(_){ return; }
  if(!s.active){ setStatus('This code expired — get a new one','bad'); return; }
  const live = new Set();
  for(const m of (s.mics||[])){
    live.add(m.id);
    if(m.name && mics[m.id]) mics[m.id].name = m.name;
    if(m.hasOffer && !mics[m.id]) startMic(m.id, m.name);
  }
  // a phone that disappeared from the roster has left
  for(const id of Object.keys(mics)) if(!live.has(id)) removeMic(id);
  renderRoster();
}

async function startMic(id, name){
  const m = { pc:null, name:name||('Mic '+id), gain:null, src:null, audio:null,
              muted:false, volume:0.5, jitter:null, live:false, starting:true };
  mics[id] = m;
  const pc = new RTCPeerConnection(CFG);
  m.pc = pc;
  pc.ondatachannel = e => { e.channel.onmessage = ev => {
    try{
      const p = JSON.parse(ev.data);
      if(p.muted!=null) m.muted = !!p.muted;
      if(p.volume!=null) m.volume = p.volume;
      applyLevel(m);
      applyShared(p);                 // shared fx, last writer wins
      unlockAudio();
      renderRoster();
    }catch(_){}
  };};
  pc.ontrack = e => attachMic(id, e.streams[0]);
  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    if(st==='connected'){ m.live=true; m.starting=false; renderBar(); }
    else if(st==='failed'){ removeMic(id); }
  };
  try{
    const d = await (await fetch(`/offer?code=${myCode}&mic=${id}`)).json();
    if(!d.sdp){ removeMic(id); return; }
    await pc.setRemoteDescription(JSON.parse(d.sdp));
    const ans = await pc.createAnswer(); await pc.setLocalDescription(ans); await iceDone(pc);
    await fetch(`/answer?code=${myCode}&mic=${id}`,{method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(pc.localDescription)});
  }catch(e){ removeMic(id); }
}

function attachMic(id, stream){
  const m = mics[id]; if(!m) return;
  // raw element = instant sound before any user gesture unlocks the FX chain
  const a = new Audio(); a.srcObject = stream; a.autoplay = true; a.muted = false;
  a.play().catch(()=>{}); m.audio = a;
  if(!ctx) buildChain();
  const src = ctx.createMediaStreamSource(stream), g = ctx.createGain();
  src.connect(g); g.connect(chain.mixBus);
  m.src = src; m.gain = g;
  // keep this receiver's buffer minimal (low latency)
  try{ const r=m.pc.getReceivers().find(x=>x.track&&x.track.kind==='audio');
       if(r){ if('jitterBufferTarget' in r) r.jitterBufferTarget=0;
              if('playoutDelayHint' in r) r.playoutDelayHint=0; } }catch(_){}
  applyLevel(m); tryActivateFX();
}

/* a mic's gain carries its volume+mute; raw <audio> mirrors it until FX is live */
function applyLevel(m){
  const v = m.muted ? 0 : m.volume*2;
  if(m.gain && ctx) m.gain.gain.setTargetAtTime(v, ctx.currentTime, 0.02);
  if(m.audio){
    if(usingFX){ m.audio.muted = true; }               // mix plays; element silent
    else { m.audio.muted = m.muted; m.audio.volume = Math.min(1, Math.max(0, m.volume*2)); }
  }
}
function removeMic(id){
  const m = mics[id]; if(!m) return;
  try{ m.pc && m.pc.close(); }catch(_){}
  try{ m.src && m.src.disconnect(); m.gain && m.gain.disconnect(); }catch(_){}
  if(m.audio){ m.audio.srcObject=null; }
  delete mics[id]; renderRoster(); renderBar();
}
function iceDone(pc){ return new Promise(res=>{
  if(pc.iceGatheringState==='complete') return res();
  const c=()=>{ if(pc.iceGatheringState==='complete'){ pc.removeEventListener('icegatheringstatechange',c); res(); } };
  pc.addEventListener('icegatheringstatechange',c); setTimeout(res,4000);
});}

/* ───────── roster + quality ───────── */
function qualityClass(j){ if(j==null) return ''; if(j<=10) return 'ok'; if(j<=30) return 'fair'; return 'poor'; }
function renderRoster(){
  const box = $('roster'); const ids = Object.keys(mics).sort((a,b)=>+a-+b);
  box.innerHTML = '';
  for(const id of ids){
    const m = mics[id];
    const row = document.createElement('div');
    row.className = 'mic' + (m.muted?' muted':'');
    const q = qualityClass(m.jitter);
    const st = m.live ? (m.jitter!=null?`${Math.round(m.jitter)}ms`:'live') : 'connecting…';
    row.innerHTML =
      `<div class="who"><div class="nm">🎤 ${esc(m.name)}</div><div class="st ${q}">${st}</div></div>`;
    const vol = document.createElement('input');
    vol.type='range'; vol.min=0; vol.max=1; vol.step=0.01; vol.value=m.volume;
    vol.oninput = () => { m.volume = +vol.value; applyLevel(m); };
    const mute = document.createElement('button');
    mute.className='mute'; mute.textContent = m.muted?'Unmute':'Mute';
    mute.onclick = () => { m.muted=!m.muted; applyLevel(m); renderRoster(); };
    row.appendChild(vol); row.appendChild(mute);
    box.appendChild(row);
  }
  const n = ids.length;
  $('hint').textContent = n ? `${n} singer${n>1?'s':''} connected · scan again to add more (up to 6)`
                            : 'Waiting for the first singer…';
}
function esc(x){ return (x||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

function renderBar(){
  const n = Object.values(mics).filter(m=>m.live).length;
  if(!n){ setStatus('Waiting for singers…','mid'); return; }
  const worst = Math.max(0, ...Object.values(mics).map(m=>m.jitter||0));
  const cls = worst<=10?'ok':(worst<=30?'mid':'bad');
  setStatus(`${n} singer${n>1?'s':''} live`, cls);
}
async function updateStats(){
  for(const id of Object.keys(mics)){
    const m = mics[id]; if(!m.pc || m.pc.connectionState!=='connected') continue;
    try{
      const r = m.pc.getReceivers().find(x=>x.track&&x.track.kind==='audio');
      if(r){ if('jitterBufferTarget' in r) r.jitterBufferTarget=0;
             if('playoutDelayHint' in r) r.playoutDelayHint=0; }
      const st = await m.pc.getStats(); let jit=null;
      st.forEach(s=>{ if(s.type==='inbound-rtp'&&s.kind==='audio'&&s.jitter!=null) jit=s.jitter*1000; });
      m.jitter = jit;
    }catch(_){}
  }
  renderRoster(); renderBar();
}

boot();
</script>
</body>
</html>
